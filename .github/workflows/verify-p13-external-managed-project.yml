name: Verify P13 External Managed Project

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/verify-managed-project-orchestration.py'
      - 'tools/production-e2e-harness.py'
      - 'tools/verify-production-e2e-managed-project.py'
      - 'core/production-e2e-harness.md'
      - 'tools/failure-recovery-proof.py'
      - 'tools/test-failure-recovery-proof.py'
      - 'tools/verify-failure-recovery-managed-project.py'
      - 'core/failure-recovery-proof.md'
      - 'tools/multi-session-continuation.py'
      - 'tools/test-multi-session-continuation.py'
      - 'tools/test-multi-session-two-process.py'
      - 'tools/verify-multi-session-managed-project.py'
      - 'core/multi-session-continuation-proof.md'
      - 'adapters/reference-host.py'
      - 'adapters/reference-verification.py'
      - 'tools/runtime-adapter-bridge.py'
      - 'tools/step-readiness-orchestrator.py'
      - 'tools/development-task-controller.py'
      - 'tools/devos-runtime-handoff.py'
      - '.github/workflows/verify-p13-external-managed-project.yml'
      - 'tools/autonomous-orchestrator.py'
      - 'tools/orchestration-checkpoint.py'
      - 'tools/operational-intelligence.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-managed-project-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DevOS
        uses: actions/checkout@v4
        with:
          path: devos

      - name: Checkout real DevOS-managed project
        uses: actions/checkout@v4
        with:
          repository: zzpsah/automation-suite
          ref: main
          path: managed-project

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify P13 against automation-suite
        run: >-
          python devos/tools/verify-managed-project-orchestration.py
          --project-root "$GITHUB_WORKSPACE/managed-project"
          --expected-repository zzpsah/automation-suite

      - name: Verify Production E2E Harness against automation-suite
        run: >-
          python devos/tools/verify-production-e2e-managed-project.py
          --project-root "$GITHUB_WORKSPACE/managed-project"
          --expected-repository zzpsah/automation-suite

      - name: Upload Production E2E evidence
        uses: actions/upload-artifact@v4
        with:
          name: production-e2e-managed-project-evidence
          path: managed-project/.ai/EVIDENCE/production-e2e-managed-project.json
          if-no-files-found: error

      - name: Verify Failure Recovery Proof against automation-suite
        run: >-
          python devos/tools/verify-failure-recovery-managed-project.py
          --project-root "$GITHUB_WORKSPACE/managed-project"
          --expected-repository zzpsah/automation-suite

      - name: Upload Failure Recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: failure-recovery-managed-project-evidence
          path: |
            managed-project/.ai/EVIDENCE/failure-recovery-managed-checkpoint.json
            managed-project/.ai/EVIDENCE/failure-recovery-managed-result.json
            managed-project/.ai/EVIDENCE/failure-recovery-managed-proof.json
          if-no-files-found: error

      - name: Verify Multi-Session Fresh-AI Continuation against automation-suite
        run: >-
          python devos/tools/verify-multi-session-managed-project.py
          --project-root "$GITHUB_WORKSPACE/managed-project"
          --expected-repository zzpsah/automation-suite

      - name: Upload Multi-Session continuation evidence
        uses: actions/upload-artifact@v4
        with:
          name: multi-session-managed-project-evidence
          path: |
            managed-project/.ai/EVIDENCE/multi-session-a-input.json
            managed-project/.ai/EVIDENCE/multi-session-continuation.json
            managed-project/.ai/EVIDENCE/multi-session-b-current.json
            managed-project/.ai/EVIDENCE/multi-session-b-drift.json
            managed-project/.ai/EVIDENCE/multi-session-managed-proof.json
          if-no-files-found: error
