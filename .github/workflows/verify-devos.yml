name: Verify Development OS

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  human-language-engine:
    name: Verify Human Language Execution Engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify human-language execution contract
        run: python tools/verify-human-language-engine.py

  state-resolver:
    name: Verify AI State Resolver v1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify resolver contract and integration
        run: python tools/verify-state-resolver.py

  verification-engine:
    name: Verify Verification / Test Engine v1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify verification engine contract
        run: python tools/verify-verification-engine.py

  security-gate:
    name: Verify Security Gate v1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify Security Gate contract
        run: python tools/verify-security-gate.py

  teaching-engine:
    name: Verify Teaching Engine v1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify Teaching Engine contract
        run: python tools/verify-teaching-engine.py

  multi-ai-portability:
    name: Verify Multi-AI Portability v1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify Multi-AI portability contract
        run: python tools/verify-multi-ai-portability.py

  auto-onboarding:
    name: Verify Auto-Onboarding v1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify auto-onboarding contract
        run: python tools/verify-auto-onboarding.py

  agent-orchestration:
    name: Verify Agent Orchestration v1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify Agent Orchestration contract
        run: python tools/verify-agent-orchestration.py

  autonomous-development-loop:
    name: Verify Autonomous Development Loop v1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify Autonomous Development Loop contract
        run: python tools/verify-autonomous-loop.py

  executable-development-runtime:
    name: Verify Executable Development Runtime v1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify Executable Development Runtime contract
        run: python tools/verify-execution-runtime.py

  host-adapter:
    name: Verify Host Adapter Contract v1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify Host Adapter contract
        run: python tools/verify-host-adapter.py
      - name: Run reference host adapter integration checks
        run: python tools/test-reference-host-adapter.py

  external-adapter:
    name: Verify External Integration Adapter v1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify External Integration Adapter contract
        run: python tools/verify-external-adapter.py
      - name: Run GitHub reference adapter integration checks
        run: python tools/test-github-reference.py
      - name: Run external runtime bridge integration checks
        run: python tools/test-external-runtime-bridge.py
      - name: Run live GitHub provider integration check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEVOS_GITHUB_REPOSITORY: ${{ github.repository }}
        run: python tools/test-github-live.py

  remote-mutation-controls:
    name: Verify Remote Mutation Controls v1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify Remote Mutation Controls contract and reference path
        run: python tools/verify-remote-mutation.py

  development-task-controller:
    name: Verify P9 Development Task Controller v1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify P9 Development Task Controller contract
        run: python tools/verify-development-task-controller.py

  context-sync:
    name: Verify Durable Context Sync v1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify durable context-sync contract
        run: python tools/verify-context-sync.py

  project-manifest:
    name: Verify DevOS Project Manifest v1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify project manifest compatibility contract
        run: python tools/verify-project-manifest.py

  project-identity:
    name: Verify DevOS Project Identity Discovery v1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify project identity discovery contract
        run: python tools/verify-project-identity.py

  context-integrity:
    name: Verify DevOS Context Freshness and Integrity v1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify context integrity checker contract
        run: python tools/verify-context-integrity.py
      - name: Run context freshness and integrity check
        run: python tools/check-context-integrity.py

  context-reconciliation:
    name: Verify DevOS Safe Context Reconciliation v1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify safe reconciliation boundaries
        run: python tools/verify-context-reconciliation.py
      - name: Run executable reconciliation cases
        run: python tools/test-context-reconciliation.py
