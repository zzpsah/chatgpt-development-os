name: Verify Project Remediation Planner

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run remediation planner regression corpus
        run: python tools/test-devos-project-remediation.py
      - name: Verify contract boundaries
        run: |
          grep -q 'REMEDIATION PLAN != AUTHORIZATION' core/project-remediation-planner.md
          grep -q 'FLEET ATTENTION != AUTOMATIC MUTATION' core/project-remediation-planner.md
