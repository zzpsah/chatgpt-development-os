name: DevOS Context Sync Contract Smoke

on:
  workflow_call:
    inputs:
      context_directory:
        required: false
        type: string
        default: .ai
      meaningful_path_patterns:
        required: false
        type: string
        default: 'src/**,app/**,package.json,.github/workflows/**'

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          echo "context_directory=${{ inputs.context_directory }}"
          echo "patterns=${{ inputs.meaningful_path_patterns }}"
          git rev-parse HEAD
