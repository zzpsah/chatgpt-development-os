name: Verify DevOS Actionable Hold

on:
  pull_request:
    paths:
      - 'core/actionable-hold-scoped-approval.md'
      - 'tools/devos-actionable-hold.py'
      - 'tools/test-devos-actionable-hold.py'
      - 'tools/devos-continuation-path.py'
      - 'tools/test-actionable-hold-continuation-integration.py'
      - 'tools/human-language-interpreter.py'
      - 'tools/semantic-goal-to-plan.py'
      - 'tools/step-readiness-orchestrator.py'
      - 'tools/development-task-controller.py'
      - 'docs/ACTIONABLE-HOLDS-AND-SCOPED-APPROVAL.md'
      - 'docs/ACTIONABLE-HOLD-IMPLEMENTATION-CHECKPOINT.md'
      - '.github/workflows/verify-actionable-hold.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run deterministic actionable-hold regression corpus
        run: python tools/test-devos-actionable-hold.py
      - name: Run real continuation-path integration regressions
        run: python tools/test-actionable-hold-continuation-integration.py
      - name: Verify normative markers
        run: |
          python - <<'PY'
          from pathlib import Path
          contract = Path('core/actionable-hold-scoped-approval.md').read_text(encoding='utf-8')
          docs = Path('docs/ACTIONABLE-HOLDS-AND-SCOPED-APPROVAL.md').read_text(encoding='utf-8')
          markers = [
              'Continue means resume the currently valid bounded workflow',
              'FULL APPROVAL = FULL WITHIN EXPLICIT SCOPE',
              'CONTINUE != BLANKET AUTHORIZATION',
          ]
          for marker in markers:
              assert marker in contract or marker in docs, marker
          print('PASS: actionable-hold contract/documentation markers')
          PY
