name: Live DevOS GitHub Adapter Mutation Test

on:
  push:
    branches:
      - live-test/devos-github-adapter-20260914
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/live-devos-github-adapter-test.yml'

permissions:
  contents: read

jobs:
  live-mutation:
    name: Reconcile and mutate isolated test file through DevOS adapter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Reconcile and execute governed update/delete
        env:
          DEVOS_GITHUB_APP_ID: ${{ secrets.DEVOS_GITHUB_APP_ID }}
          DEVOS_GITHUB_APP_PRIVATE_KEY: ${{ secrets.DEVOS_GITHUB_APP_PRIVATE_KEY }}
        run: |
          python - <<'PY'
          import importlib.util
          import json
          import sys
          import urllib.parse
          from pathlib import Path

          root = Path.cwd()
          spec = importlib.util.spec_from_file_location('devos_live_adapter', root / 'tools/devos-github-provider-adapter.py')
          adapter = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = adapter
          assert spec and spec.loader
          spec.loader.exec_module(adapter)

          auth = adapter._load_module(adapter.AUTH_MODULE_PATH, 'devos_proven_auth')
          app_id = auth.os.environ.get('DEVOS_GITHUB_APP_ID', '').strip()
          private_key = auth.os.environ.get('DEVOS_GITHUB_APP_PRIVATE_KEY', '')
          if not app_id or not private_key:
              raise SystemExit('missing GitHub App credentials')

          OWNER = 'zzpsah'
          REPO = 'chatgpt-development-os'
          RESOURCE = 'artifacts/live-test/devos-github-adapter-20260914.txt'
          WORKFLOW = 'devos-live-provider-mutation-test-v1'
          PROJECT = REPO
          BRANCH = 'live-test/devos-github-adapter-20260914'

          def token_provider(repository: str) -> str:
              owner, repo = adapter._parse_repository(repository)
              jwt = auth.make_jwt(app_id, private_key)
              installation = auth.request_json(
                  f"{adapter.API_ROOT}/repos/{urllib.parse.quote(owner)}/{urllib.parse.quote(repo)}/installation",
                  method='GET', bearer=jwt
              )
              installation_id = installation.get('id')
              if not isinstance(installation_id, int):
                  raise RuntimeError('GitHub App installation was not resolved')
              token_response = auth.mint_installation_token(jwt, installation_id)
              token = token_response.get('token')
              if not isinstance(token, str) or not token:
                  raise RuntimeError('GitHub did not return an installation token')
              return token

          read_operation = {
              'provider': 'github', 'owner': OWNER, 'repository': REPO, 'resource': RESOURCE,
              'capability': 'read.file', 'workflow': 'inspect', 'project': PROJECT,
              'impact': 'READ_ONLY', 'freshness': None, 'action': 'file.get', 'inputs': {}
          }
          read = adapter.execute(read_operation, token_provider=token_provider)
          print('RECONCILE:', json.dumps(read, sort_keys=True))
          if read.get('status') != 'COMPLETE':
              raise SystemExit(f'reconciliation failed: {read}')
          current_sha = read.get('result', {}).get('sha')
          if not current_sha:
              raise SystemExit(f'reconciliation did not provide current sha: {read}')

          def mutate(action, content=None, expected_sha=None, impact='LOW', auth_impact='LOW'):
              operation = {
                  'provider': 'github', 'owner': OWNER, 'repository': REPO, 'resource': RESOURCE,
                  'capability': action, 'workflow': WORKFLOW, 'project': PROJECT,
                  'impact': impact, 'freshness': None, 'action': action,
                  'inputs': {'message': f'DevOS live adapter test: {action}', 'branch': BRANCH}
              }
              if content is not None:
                  operation['inputs']['content'] = content
              if expected_sha is not None:
                  operation['inputs']['expected_sha'] = expected_sha
              authorization = {
                  'provider': 'github', 'owner': OWNER, 'repository': REPO, 'resource': RESOURCE,
                  'capability': action, 'workflow': WORKFLOW, 'project': PROJECT,
                  'impact_ceiling': auth_impact, 'freshness': None,
                  'authorization_id': f'LIVE-TEST-{action.upper().replace(".", "-")}-20260914'
              }
              result = adapter.execute(operation, authorization, token_provider=token_provider)
              print(action.upper(), json.dumps(result, sort_keys=True))
              if result.get('status') != 'COMPLETE' or result.get('mutation') != 'COMPLETE' or result.get('evidence') != 'FRESH_PROVIDER_READBACK':
                  raise SystemExit(f'{action} failed: {result}')
              return result

          updated = mutate('file.update', 'DevOS live mutation test v1\nUPDATED\n', current_sha, 'LOW', 'LOW')
          update_sha = updated.get('readback', {}).get('sha')
          if not update_sha:
              raise SystemExit(f'update readback missing sha: {updated}')

          deleted = mutate('file.delete', expected_sha=update_sha, impact='HIGH', auth_impact='HIGH')
          if deleted.get('readback', {}).get('status') != 'ABSENT':
              raise SystemExit(f'delete readback did not prove absence: {deleted}')

          final_read = adapter.execute(read_operation, token_provider=token_provider)
          print('FINAL_RECONCILE:', json.dumps(final_read, sort_keys=True))
          if final_read.get('status') != 'FAILED' or 'PROVIDER_READ_FAILED' not in final_read.get('reason_codes', []):
              # A missing file is represented by the provider read as a failed/404 path here;
              # the mutation's own ABSENT readback remains the completion proof.
              raise SystemExit(f'unexpected final read state: {final_read}')

          print('LIVE_DEVOS_GITHUB_ADAPTER_MUTATION_TEST: PASS (reconciled update + delete)')
          PY
