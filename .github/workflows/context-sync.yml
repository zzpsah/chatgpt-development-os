# Reusable GitHub-side durable context synchronizer.
# Project repositories call this workflow from their own .github/workflows directory.
name: Development OS Context Sync

on:
  workflow_call:
    inputs:
      context_directory:
        required: false
        type: string
        default: .ai
      meaningful_path_patterns:
        required: false
        type: string
        default: 'src/**,app/**,pages/**,components/**,api/**,supabase/**,migrations/**,prisma/**,package.json,pyproject.toml,requirements.txt,Cargo.toml,go.mod,Dockerfile,.github/workflows/**'
    permissions:
      contents: write

jobs:
  sync-context:
    if: ${{ !contains(github.event.head_commit.message, '[devos-context-sync]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize durable project context
        shell: bash
        env:
          CONTEXT_DIR: ${{ inputs.context_directory }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          mkdir -p "$CONTEXT_DIR"
          CHANGELOG="$CONTEXT_DIR/CHANGELOG.md"
          STATE="$CONTEXT_DIR/CURRENT-STATE.md"
          commit_sha="$(git rev-parse HEAD)"
          commit_subject="$(git log -1 --pretty=%s)"
          commit_author="$(git log -1 --pretty='%an')"
          commit_date="$(git log -1 --date=short --pretty='%ad')"

          if git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            changed_files="$(git diff --name-only "$BEFORE_SHA" "$commit_sha" | sed '/^\.ai\//d' | head -500)"
          else
            changed_files="$(git diff-tree --no-commit-id --name-only -r "$commit_sha" | sed '/^\.ai\//d' | head -500)"
          fi

          meaningful=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              src/*|app/*|pages/*|components/*|api/*|supabase/*|migrations/*|prisma/*|package.json|pyproject.toml|requirements.txt|Cargo.toml|go.mod|Dockerfile|.github/workflows/*)
                meaningful=true; break;;
            esac
          done <<< "$changed_files"

          [ -f "$CHANGELOG" ] || printf '%s\n' '# Project Change Log' '' 'Automatically maintained by Development OS.' '' > "$CHANGELOG"
          tmp="$(mktemp)"
          {
            printf '%s\n' "## $commit_date — $commit_subject" "- Commit: $commit_sha" "- Author: $commit_author" "- Classification: $([ "$meaningful" = true ] && echo meaningful || echo routine)" '- Changed files:'
            if [ -n "$changed_files" ]; then
              sed 's/^/- `/' <<< "$changed_files" | sed 's/$/`/'
            else
              printf '%s\n' '- (no application files detected)'
            fi
            printf '%s\n' ''
            cat "$CHANGELOG"
          } > "$tmp"
          mv "$tmp" "$CHANGELOG"

          if [ "$meaningful" = true ]; then
            [ -f "$STATE" ] || printf '%s\n' '# Current State' '' 'Last verified: never' '' '## Working' '- ' '' '## In progress' '- ' '' '## Known issues' '- ' '' '## Next actions' '- ' '' '## Verification' '- Automated context synchronization does not run project tests.' > "$STATE"
            tmp_state="$(mktemp)"
            awk -v date="$commit_date" -v sha="$commit_sha" -v subject="$commit_subject" '
              BEGIN { inserted=0; skip=0 }
              /^## Last automated change$/ { if (!inserted) { print "## Last automated change"; print "- Commit: " sha; print "- Change: " subject; print "- Date: " date; print "- Durable context synchronization: completed"; print ""; inserted=1 } skip=1; next }
              skip && /^## / { skip=0 }
              skip { next }
              /^Last verified:/ && !inserted { print "Last verified: " date; print ""; print "## Last automated change"; print "- Commit: " sha; print "- Change: " subject; print "- Date: " date; print "- Durable context synchronization: completed"; print ""; inserted=1; next }
              { print }
            ' "$STATE" > "$tmp_state"
            mv "$tmp_state" "$STATE"
          fi

          if git diff --quiet -- "$CHANGELOG" "$STATE"; then exit 0; fi
          git config user.name 'development-os[bot]'
          git config user.email 'development-os[bot]@users.noreply.github.com'
          git add "$CHANGELOG"
          [ -f "$STATE" ] && git add "$STATE"
          git commit -m 'chore: sync project AI context [devos-context-sync]'
          git push
