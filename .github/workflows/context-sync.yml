# Reusable GitHub-side durable context synchronizer.
# Project repositories call this workflow from their own .github/workflows directory.
name: Development OS Context Sync

on:
  workflow_call:
    inputs:
      context_directory:
        required: false
        type: string
        default: .ai
      meaningful_path_patterns:
        required: false
        type: string
        default: 'src/**,app/**,pages/**,components/**,api/**,lib/**,public/**,supabase/**,migrations/**,prisma/**,db/**,database/**,package.json,package-lock.json,pnpm-lock.yaml,yarn.lock,pyproject.toml,requirements.txt,poetry.lock,Cargo.toml,Cargo.lock,go.mod,go.sum,composer.json,pom.xml,build.gradle,Dockerfile,*.csproj,*.sln,.github/workflows/**'

jobs:
  sync-context:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout project repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Development OS tools
        uses: actions/checkout@v4
        with:
          repository: zzpsah/chatgpt-development-os
          ref: main
          path: .devos
          fetch-depth: 1

      - name: Synchronize durable project context
        env:
          DEVOS_CONTEXT_DIRECTORY: ${{ inputs.context_directory }}
          DEVOS_BEFORE_SHA: ${{ github.event.before }}
          DEVOS_MEANINGFUL_PATTERNS: ${{ inputs.meaningful_path_patterns }}
        run: python .devos/tools/context-sync.py
