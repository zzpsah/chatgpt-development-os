name: Verify Development OS Contracts

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Verify Documentation Integrity
        run: |
          python tools/verify-documentation-integrity.py
          python tools/test-documentation-integrity.py

      - name: Install parser dependency
        run: python -m pip install pyyaml

      - name: Verify readiness evidence and reject inflated claims
        run: |
          python tools/verify-readiness-evidence.py
          python tools/test-readiness-evidence.py

      - name: Verify foundation bootstrap
        run: |
          python tools/devos-bootstrap.py
          python tools/test-devos-bootstrap.py

      - name: Verify Foundation Health & State Consistency
        run: |
          python tools/test-devos-audit.py
          python tools/test-foundation-health.py

      - name: Verify Cross-Host Recovery Friction & Onboarding
        run: |
          python tools/test-host-profile.py
          python tools/test-fresh-ai-recovery.py
          python tools/test-recovery-friction.py

      - name: Verify Human Language Execution Engine
        run: python tools/verify-human-language-engine.py

      - name: Test contextual Human Language Interpreter v2
        run: python tools/test-human-language-interpreter.py

      - name: Verify P16 Semantic Goal-to-Plan Compiler
        run: python tools/test-semantic-goal-to-plan.py

      - name: Verify P17 Step Readiness and Authorization Orchestrator
        run: python tools/test-step-readiness-orchestrator.py

      - name: Verify P17 end-to-end plan readiness handoff
        run: python tools/test-p17-end-to-end.py

      - name: Verify Production E2E Harness
        run: python tools/test-production-e2e-harness.py

      - name: Verify Failure and Recovery Proof
        run: python tools/test-failure-recovery-proof.py

      - name: Verify Multi-Session Fresh-AI Continuation
        run: python tools/test-multi-session-continuation.py

      - name: Verify Multi-Session Two-Process Proof
        run: python tools/test-multi-session-two-process.py

      - name: Verify Controlled Remote Mutation Proof
        run: python tools/test-controlled-remote-mutation-proof.py

      - name: Verify AI State Resolver
        run: python tools/verify-state-resolver.py

      - name: Verify Verification / Test Engine
        run: python tools/verify-verification-engine.py

      - name: Verify Security Gate
        run: python tools/verify-security-gate.py

      - name: Verify Teaching Engine
        run: python tools/verify-teaching-engine.py

      - name: Verify Multi-AI Portability
        run: python tools/verify-multi-ai-portability.py

      - name: Verify Auto-Onboarding
        run: python tools/verify-auto-onboarding.py

      - name: Verify Agent Orchestration
        run: python tools/verify-agent-orchestration.py

      - name: Verify Autonomous Development Loop
        run: python tools/verify-autonomous-loop.py

      - name: Verify DevOS Stance Codes and DESI Style
        run: python tools/verify-stance-codes.py

      - name: Test composable DevOS stance parser
        run: python tools/test-devos-stance-parser.py

      - name: Test repository-backed universal DevOS activation
        run: python tools/test-devos-universal-activation.py

      - name: Verify P12 Operational Intelligence
        run: python tools/verify-operational-intelligence.py

      - name: Verify P12 fresh-repository determinism
        run: python tools/test-operational-intelligence-recovery.py

      - name: Verify P12 controller/OI/runtime-handoff integration
        run: python tools/verify-development-task-controller-integration.py

      - name: Verify portable AI host profiles
        run: python tools/test-host-profile.py

      - name: Verify P13 autonomous orchestration
        run: python tools/test-autonomous-orchestrator.py

      - name: Verify P13 orchestration checkpoint resume
        run: python tools/test-orchestration-checkpoint.py

      - name: Verify P13 managed-project end-to-end proof
        run: python tools/test-p13-managed-project.py

      - name: Verify P14 adaptive verification and bounded healing policy
        run: python tools/test-adaptive-verification.py

      - name: Verify P14 deterministic heal execution and re-verification
        run: python tools/test-adaptive-self-heal.py
